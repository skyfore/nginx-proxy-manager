name: PAT Docker verification
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'scripts/ci/pat-docker-smoke.py'
      - '.github/workflows/pat-docker-verification.yml'
permissions:
  contents: read
concurrency:
  group: pat-docker-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  docker-smoke:
    if: github.repository == 'skyfore/nginx-proxy-manager' && github.event.pull_request.number == 1 && github.head_ref == 'feat/proxy-host-directory-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and test frontend using official project script
        timeout-minutes: 12
        run: |
          bash scripts/ci/frontend-build
          (cd backend && ../frontend/node_modules/.bin/biome lint \
            internal/api-token.js routes/api-tokens.js lib/api-token-step-up.js \
            test/api-token-step-up-limit.test.js test/api-token-integration.test.js)
      - name: Build native Docker image without publishing
        timeout-minutes: 15
        env:
          TEST_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          docker buildx build --platform linux/amd64 --load \
            -t npm-pat-local:test -f docker/Dockerfile \
            --build-arg BUILD_VERSION=pat-test \
            --build-arg BUILD_COMMIT="$TEST_COMMIT" \
            --build-arg BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M:%S UTC')" .
      - name: Test PAT policy inside production image
        run: |
          docker run --rm --network none --entrypoint sh npm-pat-local:test -c \
            'node --test test/api-token-policy.test.js test/api-token-step-up-limit.test.js'
      - name: Test isolated SQLite and Express integration (Nginx and ACME stubbed)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status=0
          docker run --rm --network none --tmpfs /data \
            -e NPM_API_TOKEN_TEST=1 -e NODE_CONFIG_DIR=/data/empty-config \
            -e DB_SQLITE_FILE=/data/test.sqlite \
            --entrypoint node npm-pat-local:test \
            --test --test-reporter=tap test/api-token-integration.test.js >"$output" 2>&1 || status=$?
          # Assertion diagnostics can contain fixture credentials. Print counts only.
          grep -E '^# (tests|pass|fail|skipped|duration_ms) ' "$output" || true
          test "$status" -eq 0
          grep -Eq '^# tests [1-9][0-9]*$' "$output"
          grep -Eq '^# fail 0$' "$output"
          grep -Eq '^# skipped 0$' "$output"
      - name: Start disposable SQLite stack on loopback
        run: |
          docker network create npm-pat-test
          docker volume create npm-pat-test-data
          docker volume create npm-pat-test-certs
          docker run -d --name upstream --network npm-pat-test nginx:alpine
          docker exec upstream sh -c 'printf "pat-docker-smoke-upstream\n" > /usr/share/nginx/html/index.html'
          docker run -d --name npm-pat-test --network npm-pat-test \
            -p 127.0.0.1:18081:81 -p 127.0.0.1:18080:80 \
            -e DB_SQLITE_FILE=/data/database.sqlite -e DISABLE_IPV6=true \
            -e IP_RANGES_FETCH_ENABLED=false \
            -v npm-pat-test-data:/data -v npm-pat-test-certs:/etc/letsencrypt \
            npm-pat-local:test
      - name: Test UI, real authentication, PAT lifecycle and Nginx forwarding
        timeout-minutes: 10
        run: python3 scripts/ci/pat-docker-smoke.py
      - name: Verify live Nginx configuration
        run: docker exec npm-pat-test nginx -t
      - name: Container status (no credentials or application logs)
        if: always()
        run: docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
      - name: Destroy disposable containers and data
        if: always()
        run: |
          docker rm -fv npm-pat-test upstream 2>/dev/null || true
          docker volume rm npm-pat-test-data npm-pat-test-certs 2>/dev/null || true
          docker network rm npm-pat-test 2>/dev/null || true
